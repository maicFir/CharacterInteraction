# Use on a host that already has Nginx and a valid certificate.
# Replace domain/certificate paths before enabling. Keep the API on loopback.
# Host port must match API_HOST_PORT (default 18473); container port stays 8000.
server {
  listen 443 ssl;
  server_name api.example.com;
  ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
  client_max_body_size 4m;
  location / {
    proxy_pass http://127.0.0.1:18473;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1800s;
  }
}

[project]
name = "after-rain-api"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
# faster-whisper 1.2.1 still calls av.open(metadata_errors=...), removed in PyAV 19.
local = ["faster-whisper==1.2.1", "av>=11,<19", "piper-tts>=1.3,<2"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
